[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "DJ", "RUF"]
ignore = [
    "RUF001", # les messages français contiennent des caractères typographiques
    "RUF002",
    "RUF003",
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
